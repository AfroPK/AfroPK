<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="300" viewBox="0 0 1500 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A03993"/>
      <stop offset="100%" stop-color="#CE4968"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8F8F9"/>
      <stop offset="100%" stop-color="#F8F8F9"/>
    </linearGradient>
  </defs>

  <rect width="1500" height="300" fill="url(#bg)"/>

  <!-- subtle grid / texture -->
  <g opacity="0.08">
    <line x1="0" y1="75" x2="1500" y2="75" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="150" x2="1500" y2="150" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="225" x2="1500" y2="225" stroke="#fff" stroke-width="1"/>
    <line x1="375" y1="0" x2="375" y2="300" stroke="#fff" stroke-width="1"/>
    <line x1="750" y1="0" x2="750" y2="300" stroke="#fff" stroke-width="1"/>
    <line x1="1125" y1="0" x2="1125" y2="300" stroke="#fff" stroke-width="1"/>
  </g>

  <!-- decorative emoji dots -->
  <text x="140" y="205" font-size="40" opacity="0.9">🐧</text>
  <text x="1255" y="90" font-size="40" opacity="0.9">🎮</text>
  <text x="1330" y="220" font-size="36" opacity="0.8">🖥️</text>
  <text x="120" y="130" font-size="32" opacity="0.7">🛠️</text>

  <!-- title (no @) -->
  <text x="750" y="160" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="100" font-weight="bold" fill="#ffffff" letter-spacing="2">AfroPK</text>

  <!-- gradient underline -->
  <rect x="480" y="180" width="540" height="6" rx="3" fill="url(#accent)"/>

  <!-- subtitle -->
  <text x="750" y="228" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#ffffff" opacity="0.95" letter-spacing="1">Tinkerer · Builder · Game-Server Host</text>

  <text x="750" y="262" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#ffffff" opacity="0.85">small useful things · no bloat, no fuss</text>
</svg>
